
services:
  temporal:
    image: temporalio/temporal:latest
    container_name: hotel-temporal
    ports:
      - "7233:7233"
      - "8233:8233"
    command: server start-dev --ip 0.0.0.0
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hotel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: hotel-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      TEMPORAL_ADDRESS: temporal:7233
      REDIS_URL: redis://redis:6379
      SUPPLIER_API_BASE_URL: http://api:3000
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    container_name: hotel-worker
    command: ["npm", "run", "worker"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      SUPPLIER_API_BASE_URL: http://api:3000
    depends_on:
      temporal:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  redis_data:
